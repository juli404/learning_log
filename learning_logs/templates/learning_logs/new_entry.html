{% extends "learning_logs/base.html" %}

{% block page_header %}
  
  <h2><a href="{% url 'learning_logs:topic' topic.id %}">{{ topic }}</a></h2>
{% endblock page_header %}

{% block content %}
  <p>Add a new entry:</p>
  <form method='post' action="{% url 'learning_logs:new_entry' topic.id %}" class="form">
	{% csrf_token %}
  {{ form.as_p }}
  	<button name='submit' class="btn btn-primary">
      add entry
    </button>
  </form>

{% endblock content %}
